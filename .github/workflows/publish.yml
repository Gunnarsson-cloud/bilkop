name: Publicera sajten

# Hämtar aktuella bilar och lånevillkor och publicerar sidan på GitHub Pages.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17 * * *"   # tre gånger per dag (UTC)
  push:
    paths:
      - "public/**"
      - "server/**"
      - "scripts/build-site.js"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-site.js site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
