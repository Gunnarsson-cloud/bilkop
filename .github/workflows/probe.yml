name: Prova källor live

# Kör bilsöks- och billånskällorna mot de riktiga sajterna och skriver ut resultatet i loggen.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Käll-id separerade med mellanslag (tomt = alla)"
        required: false
        default: ""
      save:
        description: "Spara hämtade sidor till grenen (probe-output/)"
        type: boolean
        default: false
  push:
    paths:
      - "server/**"
      - "scripts/probe.js"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/probe.js $SOURCES ${SAVE:+--save probe-output}
        env:
          SOURCES: ${{ github.event.inputs.sources }}
          SAVE: ${{ github.event.inputs.save == 'true' && '1' || '' }}
      - name: Spara sidorna på grenen
        if: github.event.inputs.save == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-output
          git commit -m "Spara live-sidor från källorna" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
