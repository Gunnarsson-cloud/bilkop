name: Prova källor live

# Kör bilsöks- och billånskällorna mot de riktiga sajterna och skriver ut resultatet i loggen.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Käll-id separerade med mellanslag (tomt = alla)"
        required: false
        default: ""
      save:
        description: "Spara hämtade sidor som artefakt i en dag"
        type: boolean
        default: false
  push:
    paths:
      - "server/**"
      - "scripts/probe.js"
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/probe.js $SOURCES ${SAVE:+--save probe-output}
        env:
          SOURCES: ${{ github.event.inputs.sources }}
          SAVE: ${{ github.event.inputs.save == 'true' && '1' || '' }}
      - name: Spara sidorna som arbetsflödesartefakt (1 dag)
        if: github.event.inputs.save == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe-output
          retention-days: 1
